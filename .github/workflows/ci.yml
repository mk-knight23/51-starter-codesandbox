name: Continuous Integration

on:
  push:
    branches: [main, upgrade/v1]
  pull_request:
    branches: [main, upgrade/v1]
  workflow_dispatch:

jobs:
  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript checking
        run: npm run type-check

  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Build failed: index.html not found in dist/"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          retention-days: 30

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level moderate

      - name: Run security audit
        run: npm audit --audit-level moderate

      - name: Check for secrets
        run: |
          # Check for potential secrets in code
          if grep -r -i "sk-\|api_key\|secret\|password" --include="*.js" --include="*.ts" --include="*.vue" --include="*.json" src/; then
            echo "Potential secrets found in code!"
            exit 1
          fi

      - name: Check hardcoded values
        run: |
          # Check for hardcoded values that should be environment variables
          if grep -r -i "http://localhost\|127\.0\.0\.1" --include="*.js" --include="*.ts" --include="*.vue" src/; then
            echo "Potential hardcoded localhost values found!"
            exit 1
          fi